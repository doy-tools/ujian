<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ujian Kelas 7 — Nilai Otomatis</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f8fafc 50%, #ecfeff);
    color: #1e293b;
    line-height: 1.6;
    padding-bottom: 60px;
  }
  header {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #fff;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(79,70,229,.25);
  }
  header h1 { font-size: 1.5rem; margin-bottom: 6px; }
  header p { font-size: .88rem; opacity: .9; }

  .bar-wrap {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #e2e8f0;
    padding: 10px 20px;
    display: flex; align-items: center; gap: 14px;
    flex-wrap: wrap; justify-content: center;
  }
  .progress-track {
    flex: 1; min-width: 160px; height: 9px;
    border-radius: 99px; background: #e2e8f0; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4f46e5, #06b6d4);
    transition: width .3s;
  }
  .bar-wrap span { font-size: .82rem; font-weight: 600; color: #64748b; white-space: nowrap; }

  .container { max-width: 860px; margin: 0 auto; padding: 24px 16px; }

  .card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 16px;
    box-shadow: 0 2px 10px rgba(15,23,42,.04);
    animation: fade .35s ease both;
  }
  @keyframes fade { from { opacity:0; transform: translateY(10px);} to { opacity:1; transform:none;} }

  .q-head {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; margin-bottom: 10px; flex-wrap: wrap;
  }
  .badge {
    font-size: .7rem; font-weight: 700; text-transform: uppercase;
    padding: 4px 10px; border-radius: 99px;
  }
  .num { font-size: .75rem; color: #64748b; font-weight: 600; }

  .q-text { font-size: 1rem; font-weight: 600; margin-bottom: 14px; }

  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; border: 1.5px solid #e2e8f0;
    border-radius: 11px; cursor: pointer;
    transition: all .18s; background: #fff;
  }
  .option:hover { border-color: #a5b4fc; background: #f5f3ff; }
  .option input { display: none; }
  .letter {
    width: 26px; height: 26px; flex: 0 0 26px; border-radius: 50%;
    display: grid; place-items: center;
    background: #f1f5f9; color: #64748b;
    font-size: .78rem; font-weight: 700;
    transition: all .18s;
  }
  .opt-text { font-size: .92rem; }
  .option input:checked ~ .letter { background: #4f46e5; color: #fff; }
  .option:has(input:checked) { border-color: #4f46e5; background: #eef2ff; }

  .option.correct { border-color: #10b981 !important; background: #ecfdf5 !important; }
  .option.correct .letter { background: #10b981 !important; color: #fff !important; }
  .option.wrong { border-color: #ef4444 !important; background: #fef2f2 !important; }
  .option.wrong .letter { background: #ef4444 !important; color: #fff !important; }
  .option.disabled { cursor: default; }
  .option.disabled:hover { background: inherit; }

  .explain {
    display: none; margin-top: 12px; padding: 11px 14px;
    border-radius: 10px; background: #f0f9ff;
    border-left: 4px solid #0ea5e9;
    font-size: .85rem; color: #0c4a6e;
  }
  .explain.show { display: block; }

  .actions { display: flex; justify-content: center; margin-top: 26px; }
  button {
    font-family: inherit; font-size: .95rem; font-weight: 700;
    padding: 13px 30px; border: none; border-radius: 12px;
    cursor: pointer; transition: all .2s;
    background: #fff; color: #4f46e5;
    border: 1.5px solid #4f46e5;
  }
  button:hover { background: #eef2ff; }

  .auto-banner {
    display: none; margin-top: 26px; padding: 16px 20px;
    border-radius: 14px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #fff; text-align: center; font-weight: 600;
    box-shadow: 0 10px 26px rgba(79,70,229,.3);
  }
  .auto-banner.show { display: block; }

  .result {
    display: none; margin-top: 24px; padding: 26px;
    border-radius: 18px; text-align: center;
    background: #fff; border: 1px solid #e2e8f0;
    box-shadow: 0 10px 34px rgba(15,23,42,.1);
  }
  .result.show { display: block; animation: pop .4s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes pop { from { opacity:0; transform: scale(.94);} to { opacity:1; transform:none;} }

  .score-ring {
    width: 140px; height: 140px; margin: 0 auto 16px;
    border-radius: 50%; display: grid; place-items: center;
    background: conic-gradient(#4f46e5 0deg, #e2e8f0 0deg);
    transition: background .8s;
  }
  .score-inner {
    width: 112px; height: 112px; border-radius: 50%;
    background: #fff; display: grid; place-items: center;
    flex-direction: column;
  }
  .score-num { font-size: 2rem; font-weight: 800; line-height: 1; color: #4f46e5; }
  .score-lbl { font-size: .7rem; color: #64748b; font-weight: 600; }
  .result h2 { font-size: 1.15rem; margin-bottom: 6px; }
  .result .msg { color: #64748b; font-size: .9rem; margin-bottom: 14px; }
  .stats { display: flex; justify-content: center; gap: 26px; flex-wrap: wrap; font-size: .85rem; }
  .stats div b { display: block; font-size: 1.15rem; }
  .stat-ok b { color: #10b981; }
  .stat-no b { color: #ef4444; }

  footer { text-align: center; color: #64748b; font-size: .78rem; padding: 26px 16px 0; }

  @media (max-width: 520px) {
    header h1 { font-size: 1.25rem; }
    .card { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>📚 Ujian Latihan Kelas 7</h1>
  <p>35 Soal • Nilai muncul otomatis setelah semua terjawab</p>
</header>

<div class="bar-wrap">
  <span id="progressText">0 / 35 dijawab</span>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <span id="timer">⏱ 00:00</span>
</div>

<div class="container">
  <div id="quiz"></div>

  <div class="auto-banner" id="autoBanner">
    ⏳ Semua soal sudah dijawab — menghitung nilai...
  </div>

  <div class="actions">
    <button id="resetBtn">🔄 Ulangi Ujian</button>
  </div>

  <div class="result" id="result">
    <div class="score-ring" id="ring">
      <div class="score-inner">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-lbl">NILAI</div>
      </div>
    </div>
    <h2 id="resultTitle">—</h2>
    <p class="msg" id="resultMsg">—</p>
    <div class="stats">
      <div class="stat-ok"><b id="okCount">0</b>Benar</div>
      <div class="stat-no"><b id="noCount">0</b>Salah</div>
    </div>
  </div>
</div>

<footer>Nilai otomatis muncul saat semua soal terjawab.</footer>

<script>
const questions = [
  { s:"Matematika", q:"Hasil dari −12 + 20 − (−8) adalah ...", o:["0","16","24","−16"], a:1, e:"−12 + 20 = 8, lalu 8 − (−8) = 8 + 8 = 16." },
  { s:"Matematika", q:"Bentuk sederhana dari 3(2x − 5) + 4(x + 2) adalah ...", o:["10x − 7","10x + 7","10x − 23","6x − 7"], a:0, e:"3(2x−5)=6x−15 dan 4(x+2)=4x+8. Jumlahnya 10x − 7." },
  { s:"Matematika", q:"Nilai x yang memenuhi 2x + 7 = 19 adalah ...", o:["5","6","7","13"], a:1, e:"2x = 19 − 7 = 12, maka x = 6." },
  { s:"Matematika", q:"Suhu mula-mula −5 °C, naik 12 °C, lalu turun 8 °C. Suhu akhirnya ...", o:["−1 °C","1 °C","9 °C","15 °C"], a:0, e:"−5 + 12 = 7, lalu 7 − 8 = −1 °C." },
  { s:"Matematika", q:"Persegi panjang 15 cm × 8 cm. Kelilingnya ...", o:["23 cm","46 cm","120 cm","60 cm"], a:1, e:"K = 2 × (15 + 8) = 46 cm." },
  { s:"Matematika", q:"Perbandingan umur Andi : Budi = 3 : 5. Jumlah umur 40 tahun. Umur Andi ...", o:["15 tahun","20 tahun","24 tahun","25 tahun"], a:0, e:"3/8 × 40 = 15 tahun." },
  { s:"Matematika", q:"Skala peta 1 : 500.000, jarak 4 cm. Jarak sebenarnya ...", o:["2 km","20 km","200 km","2.000 km"], a:1, e:"4 × 500.000 = 2.000.000 cm = 20 km." },

  { s:"IPA", q:"Satuan SI untuk suhu adalah ...", o:["Celcius","Fahrenheit","Kelvin","Reamur"], a:2, e:"Satuan SI suhu = Kelvin (K)." },
  { s:"IPA", q:"Perubahan wujud cair menjadi gas disebut ...", o:["Menguap","Mengembun","Menyublim","Membeku"], a:0, e:"Cair → gas = menguap." },
  { s:"IPA", q:"Organ utama sistem pernapasan manusia adalah ...", o:["Jantung","Paru-paru","Hati","Ginjal"], a:1, e:"Paru-paru tempat pertukaran O₂ dan CO₂." },
  { s:"IPA", q:"Fotosintesis menghasilkan ...", o:["CO₂ dan air","Oksigen dan glukosa","Nitrogen dan air","Oksigen dan air"], a:1, e:"6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂." },
  { s:"IPA", q:"Benda 300 gram, volume 100 cm³. Massa jenisnya ...", o:["0,33 g/cm³","3 g/cm³","30 g/cm³","300 g/cm³"], a:1, e:"ρ = m/V = 300/100 = 3 g/cm³." },
  { s:"IPA", q:"Ilmu pengelompokan makhluk hidup disebut ...", o:["Ekologi","Taksonomi","Anatomi","Genetika"], a:1, e:"Taksonomi = ilmu klasifikasi makhluk hidup." },
  { s:"IPA", q:"Energi karena kedudukan benda disebut energi ...", o:["Kinetik","Potensial","Kalor","Bunyi"], a:1, e:"Energi potensial bergantung pada posisi/ketinggian." },

  { s:"IPS", q:"Indonesia terletak di antara dua benua, yaitu ...", o:["Asia dan Eropa","Asia dan Australia","Australia dan Afrika","Eropa dan Afrika"], a:1, e:"Indonesia di antara Benua Asia dan Australia." },
  { s:"IPS", q:"Masa sebelum manusia mengenal tulisan disebut zaman ...", o:["Sejarah","Praaksara","Modern","Logam"], a:1, e:"Zaman praaksara = sebelum mengenal tulisan." },
  { s:"IPS", q:"Interaksi sosial diawali oleh adanya ...", o:["Kontak sosial dan komunikasi","Konflik","Akomodasi","Asimilasi"], a:0, e:"Interaksi sosial butuh kontak sosial + komunikasi." },
  { s:"IPS", q:"Kebutuhan untuk mempertahankan hidup disebut kebutuhan ...", o:["Sekunder","Primer","Tersier","Rohani"], a:1, e:"Kebutuhan primer = kebutuhan pokok." },
  { s:"IPS", q:"ASEAN didirikan pada ...", o:["8 Agustus 1967","17 Agustus 1945","1 Juni 1966","10 November 1967"], a:0, e:"ASEAN berdiri 8 Agustus 1967 di Bangkok." },
  { s:"IPS", q:"Gambaran permukaan bumi pada bidang datar dengan skala disebut ...", o:["Globe","Peta","Atlas","Relief"], a:1, e:"Peta = gambaran permukaan bumi pada bidang datar." },

  { s:"Bahasa Indonesia", q:"Teks yang menggambarkan objek secara rinci disebut teks ...", o:["Narasi","Deskripsi","Argumentasi","Eksposisi"], a:1, e:"Teks deskripsi menggambarkan objek lewat pancaindra." },
  { s:"Bahasa Indonesia", q:"Kalimat efektif adalah ...", o:["Para siswa-siswa semua hadir.","Para siswa hadir di aula.","Semua para siswa-siswa hadir.","Para semua siswa-siswa hadir."], a:1, e:"Kalimat efektif tidak boros kata." },
  { s:"Bahasa Indonesia", q:"Rima pantun adalah ...", o:["a-a-a-a","a-b-a-b","a-a-b-b","a-b-b-a"], a:1, e:"Pantun bersajak a-b-a-b." },
  { s:"Bahasa Indonesia", q:"Cerita rakyat yang tokohnya hewan disebut ...", o:["Fabel","Legenda","Mite","Sage"], a:0, e:"Fabel = cerita dengan tokoh binatang." },
  { s:"Bahasa Indonesia", q:"Teks berisi langkah-langkah membuat sesuatu disebut teks ...", o:["Prosedur","Deskripsi","Berita","Persuasi"], a:0, e:"Teks prosedur berisi langkah-langkah runtut." },
  { s:"Bahasa Indonesia", q:"\"Angin berbisik menyampaikan salamku\" memakai majas ...", o:["Hiperbola","Personifikasi","Metafora","Simile"], a:1, e:"Personifikasi = benda mati berperilaku seperti manusia." },

  { s:"Bahasa Inggris", q:"Dina: \"How are you?\" — Rani: \"...\"", o:["I'm fine, thank you","My name is Rani","I'm from Bandung","Yes, I do"], a:0, e:"Jawaban 'How are you?' = 'I'm fine, thank you'." },
  { s:"Bahasa Inggris", q:"She ___ to school every day.", o:["go","goes","going","gone"], a:1, e:"Subjek 'she' → kata kerja + es: goes." },
  { s:"Bahasa Inggris", q:"\"It has a long trunk and big ears.\" The animal is ...", o:["Elephant","Tiger","Giraffe","Monkey"], a:0, e:"Belalai panjang = ciri gajah (elephant)." },
  { s:"Bahasa Inggris", q:"The book is ___ the table.", o:["in","on","under","between"], a:1, e:"'on' = di atas permukaan." },
  { s:"Bahasa Inggris", q:"Urutan benar: is – my – this – book ...", o:["This is my book","My book is this","Is this my book","Book my this is"], a:0, e:"Pola: This + is + my + book." },

  { s:"PPKn", q:"Sila pertama Pancasila dilambangkan dengan ...", o:["Bintang","Rantai","Pohon beringin","Kepala banteng"], a:0, e:"Sila ke-1 = bintang emas." },
  { s:"PPKn", q:"Aturan dari hati nurani tentang baik-buruk disebut norma ...", o:["Hukum","Kesusilaan","Kesopanan","Agama"], a:1, e:"Norma kesusilaan = dari hati nurani." },
  { s:"PPKn", q:"\"Bhinneka Tunggal Ika\" berarti ...", o:["Berbeda-beda tetapi tetap satu","Bersatu kita kuat","Satu untuk semua","Gotong royong"], a:0, e:"Artinya: berbeda-beda tetapi tetap satu jua." },
  { s:"PPKn", q:"UUD 1945 disahkan pada ...", o:["17 Agustus 1945","18 Agustus 1945","1 Juni 1945","1 Oktober 1945"], a:1, e:"Disahkan PPKI 18 Agustus 1945." }
];

const COLORS = {
  "Matematika":["#dbeafe","#1d4ed8"],
  "IPA":["#d1fae5","#047857"],
  "IPS":["#fef3c7","#b45309"],
  "Bahasa Indonesia":["#fce7f3","#be185d"],
  "Bahasa Inggris":["#ede9fe","#6d28d9"],
  "PPKn":["#fee2e2","#b91c1c"]
};

const LETTERS = ["A","B","C","D"];
let submitted = false;
let seconds = 0;
let timerId = null;

const quizEl = document.getElementById("quiz");
const progressText = document.getElementById("progressText");
const progressFill = document.getElementById("progressFill");
const timerEl = document.getElementById("timer");
const autoBanner = document.getElementById("autoBanner");
const resultBox = document.getElementById("result");

function render() {
  quizEl.innerHTML = questions.map((item, i) => {
    const [bg, fg] = COLORS[item.s] || ["#e2e8f0", "#334155"];
    const opts = item.o.map((opt, j) => `
      <label class="option" id="opt-${i}-${j}">
        <input type="radio" name="q${i}" value="${j}">
        <span class="letter">${LETTERS[j]}</span>
        <span class="opt-text">${opt}</span>
      </label>`).join("");
    return `
      <div class="card">
        <div class="q-head">
          <span class="badge" style="background:${bg};color:${fg}">${item.s}</span>
          <span class="num">Soal ${i + 1} dari ${questions.length}</span>
        </div>
        <p class="q-text">${item.q}</p>
        <div class="options">${opts}</div>
        <div class="explain" id="exp-${i}"></div>
      </div>`;
  }).join("");
}

function countAnswered() {
  let n = 0;
  for (let i = 0; i < questions.length; i++) {
    if (document.querySelector(`input[name="q${i}"]:checked`)) n++;
  }
  return n;
}

function updateProgress() {
  const n = countAnswered();
  progressText.textContent = `${n} / ${questions.length} dijawab`;
  progressFill.style.width = (n / questions.length * 100) + "%";
}

function onAnswer() {
  if (submitted) return;
  updateProgress();
  if (countAnswered() === questions.length) {
    submitted = true;
    clearInterval(timerId);
    autoBanner.classList.add("show");
    autoBanner.scrollIntoView({ behavior: "smooth", block: "center" });
    setTimeout(grade, 800);
  }
}

function grade() {
  autoBanner.classList.remove("show");
  let correct = 0;
  let wrong = 0;

  questions.forEach((item, i) => {
    const picked = document.querySelector(`input[name="q${i}"]:checked`);
    const chosen = picked ? parseInt(picked.value, 10) : -1;

    if (chosen === item.a) correct++;
    else wrong++;

    item.o.forEach((_, j) => {
      const label = document.getElementById(`opt-${i}-${j}`);
      label.classList.add("disabled");
      if (j === item.a) label.classList.add("correct");
      else if (j === chosen) label.classList.add("wrong");
    });

    const exp = document.getElementById(`exp-${i}`);
    const status = chosen === item.a
      ? '<b style="color:#047857">✔ Benar!</b> '
      : '<b style="color:#b91c1c">✘ Salah.</b> ';
    exp.innerHTML = status + "Jawaban benar: <b>" + LETTERS[item.a] + ". " + item.o[item.a] + "</b><br>" + item.e;
    exp.classList.add("show");

    document.querySelectorAll(`input[name="q${i}"]`).forEach(inp => inp.disabled = true);
  });

  showResult(correct, wrong);
}

function showResult(correct, wrong) {
  const score = Math.round(correct / questions.length * 100);
  document.getElementById("scoreNum").textContent = score;
  document.getElementById("okCount").textContent = correct;
  document.getElementById("noCount").textContent = wrong;

  const ring = document.getElementById("ring");
  const color = score >= 75 ? "#10b981" : score >= 60 ? "#f59e0b" : "#ef4444";
  ring.style.background = `conic-gradient(${color} ${score * 3.6}deg, #e2e8f0 0deg)`;
  document.getElementById("scoreNum").style.color = color;

  const title = document.getElementById("resultTitle");
  const msg = document.getElementById("resultMsg");

  if (score >= 90) { title.textContent = "🏆 Luar Biasa!"; msg.textContent = "Pemahamanmu sangat baik!"; }
  else if (score >= 75) { title.textContent = "🎉 Bagus Sekali!"; msg.textContent = "Sedikit latihan lagi!"; }
  else if (score >= 60) { title.textContent = "👍 Cukup Baik"; msg.textContent = "Ada materi yang perlu diulang."; }
  else { title.textContent = "📖 Perlu Belajar Lagi"; msg.textContent = "Baca pembahasan, lalu coba lagi!"; }

  resultBox.classList.add("show");
  resultBox.scrollIntoView({ behavior: "smooth", block: "center" });
}

function reset() {
  submitted = false;
  clearInterval(timerId);
  resultBox.classList.remove("show");
  autoBanner.classList.remove("show");
  document.getElementById("scoreNum").style.color = "#4f46e5";
  document.getElementById("ring").style.background = "conic-gradient(#4f46e5 0deg, #e2e8f0 0deg)";
  render();
  updateProgress();
  seconds = 0;
  timerEl.textContent = "⏱ 00:00";
  startTimer();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function startTimer() {
  timerId = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, "0");
    const s = String(seconds % 60).padStart(2, "0");
    timerEl.textContent = `⏱ ${m}:${s}`;
  }, 1000);
}

// Event listener pakai event delegation (paling aman)
quizEl.addEventListener("change", onAnswer);

document.getElementById("resetBtn").addEventListener("click", reset);

// Init
render();
updateProgress();
startTimer();
</script>
</body>
</html>
